name: CI

on:
  push:
    branches: [main, master, dev]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  # 手动触发。发版本来只挂在"推 tag"这个一次性事件上，2026-08-26 那次
  # Actions 故障里事件被压了 70 分钟才出队 —— 当时若真被丢弃，唯一的补救
  # 手段就是删 tag 重推。有了这个入口就能对着已有的 tag 直接重跑。
  #
  # 注意：workflow_dispatch 读的是目标 ref 上的 workflow 文件，所以只对
  # 本次改动之后打的 tag 生效。对着旧 tag 跑需要用 API 指定 ref。
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.7'
          cache: true

      - name: Run tests
        run: make test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.7'
          cache: true

      - name: Build
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.sha }}
        run: |
          if [ "${{ matrix.goarch }}" = "amd64" ]; then
            make build-linux
          else
            make build-linux-arm64
          fi

      - name: Upload xboard-node artifact
        uses: actions/upload-artifact@v4
        with:
          name: xboard-node-${{ matrix.goos }}-${{ matrix.goarch }}
          path: xboard-node-${{ matrix.goos }}-${{ matrix.goarch }}

      - name: Upload xbctl artifact
        uses: actions/upload-artifact@v4
        with:
          name: xbctl-${{ matrix.goos }}-${{ matrix.goarch }}
          path: xbctl-${{ matrix.goos }}-${{ matrix.goarch }}

  build-docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    # 仅上游仓库构建并推送镜像；fork 无 ghcr.io/cedar2025 写权限，跳过避免 CI 变红
    if: github.repository == 'cedar2025/xboard-node'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/cedar2025/xboard-node:latest
            ghcr.io/cedar2025/xboard-node:${{ github.sha }}
            ${{ startsWith(github.ref, 'refs/tags/') && format('ghcr.io/cedar2025/xboard-node:{0}', github.ref_name) || '' }}

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/dev'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}
          make_latest: ${{ startsWith(github.ref, 'refs/tags/') }}
          files: |
            dist/xboard-node-linux-amd64
            dist/xboard-node-linux-arm64
            dist/xbctl-linux-amd64
            dist/xbctl-linux-arm64
